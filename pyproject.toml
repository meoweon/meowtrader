# MeowTrader 项目依赖配置
# 此文件仅用于依赖管理，不用于构建或发布
#
# 注意: version 字段需要与 __init__.py 中的 __version__ 保持一致
# 构建脚本会自动检查版本号一致性
#
# 依赖版本参考 veighna_studio 4.3.0 (Python 3.13)
#
# 重要: 以下模块在 vendor/ 目录中，不需要从 PyPI 安装：
#   - vnpy (vendor/vnpy/)
#   - vnpy_binance, vnpy_okx (vendor/gateways/)
#   - vnpy_ctastrategy, vnpy_ctabacktester 等应用 (vendor/apps/)
#   - TA-Lib (resources/packages/，预编译版本)

[project]
name = "meowtrader"
version = "0.2.0"  # 应与 __init__.py 中的 __version__ 保持一致
description = "MeowTrader - A customized VeighNa trading platform"
requires-python = ">=3.13"
dependencies = [
    # ==================== 基础依赖 ====================
    "PySide6>=6.8.0",
    "PySide6-Fluent-Widgets>=1.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyzmq>=26.0.0",
    "aiohttp>=3.9.0",
    "tzlocal>=5.0.0",
    "loguru>=0.7.0",
    # TA-Lib 从 resources/packages 安装（预编译版本）
    "importlib-metadata>=6.0.0",
    "peewee>=3.17.0",
    "plotly>=5.18.0",
    "websocket-client>=1.6.0",
    "tqdm>=4.66.0",
    "deap>=1.4.0",
    "pyqtgraph>=0.13.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    # ==================== 性能优化依赖 ====================
    "numexpr>=2.8.0",
    "pyarrow>=14.0.0",
    # ==================== vnpy 底层依赖（vendor/vnpy 需要）====================
    "vnpy-rest>=1.2.0",
    "vnpy-websocket>=1.1.0",
    "vnpy-sqlite>=1.1.0",
    # ==================== 其他依赖 ====================
    "sqlalchemy>=2.0.0",
    "exchange_calendars>=4.5.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "empyrical-reloaded>=0.5.9",
]

# uv sync 需要 build-system 配置
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 告诉 hatch 不要打包（仅用于依赖管理）
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["__init__.py"]

[project.optional-dependencies]
# ==================== 开发工具 ====================
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.0.0",
]

# ==================== 数据库（可选） ====================
postgresql = ["vnpy-postgresql>=1.1.0"]
mongodb = ["vnpy-mongodb>=1.1.0"]
mysql = ["vnpy-mysql>=1.1.0"]
taos = ["vnpy-taos>=1.1.0"]

# ==================== Gateway - 国内期货（需要编译的 .pyd 文件）====================
ctp = ["vnpy-ctp>=6.7.0"]
ctp_test = ["vnpy-ctptest>=6.7.0"]
# mini = ["vnpy-mini>=1.6.0"]  # 需要编译的 .pyd 文件，已从 veighna_studio 手动复制
femas = ["vnpy-femas>=1.0.0"]
uft = ["vnpy-uft>=3.7.0"]
esunny = ["vnpy-esunny>=1.0.0"]
tts = ["vnpy-tts>=6.7.0"]

# ==================== Gateway - 国内股票/期权 ====================
xtp = ["vnpy-xtp>=2.2.0"]
tora = ["vnpy-tora>=2024.0.0"]
sopt = ["vnpy-sopt>=3.7.0"]

# ==================== Gateway - 国际/外盘 ====================
ib = ["vnpy-ib>=10.30.0"]
tap = ["vnpy-tap>=9.4.0"]
da = ["vnpy-da>=1.18.0"]

# ==================== 数据服务 ====================
rqdata = ["vnpy-rqdata>=3.2.0"]
xt = ["vnpy-xt>=1.4.0"]
tqsdk = ["vnpy-tqsdk>=3.8.0"]
mcdata = ["vnpy-mcdata>=1.0.0"]
polygon = ["vnpy-polygon>=1.0.0"]
tushare = ["vnpy-tushare>=1.4.0"]

# ==================== Web 相关（vnpy_webtrader 需要）====================
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "starlette>=0.35.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.0",
]

# ==================== 组合安装 ====================
all-db = [
    "vnpy-postgresql>=1.1.0",
    "vnpy-mongodb>=1.1.0",
    "vnpy-mysql>=1.1.0",
    "vnpy-taos>=1.1.0",
]

all-datafeed = [
    "vnpy-rqdata>=3.2.0",
    "vnpy-xt>=1.4.0",
    "vnpy-tqsdk>=3.8.0",
    "vnpy-mcdata>=1.0.0",
    "vnpy-polygon>=1.0.0",
    "vnpy-tushare>=1.4.0",
]

all-gateways = [
    "vnpy-ctp>=6.7.0",
    "vnpy-ctptest>=6.7.0",
    # "vnpy-mini>=1.6.0",  # 需要编译的 .pyd 文件，已从 veighna_studio 手动复制
    "vnpy-femas>=1.0.0",
    "vnpy-uft>=3.7.0",
    "vnpy-esunny>=1.0.0",
    "vnpy-tts>=6.7.0",
    "vnpy-tora>=2024.0.0",
    "vnpy-xtp>=2.2.0",
    "vnpy-sopt>=3.7.0",
    "vnpy-tap>=9.4.0",
    "vnpy-ib>=10.30.0",
    "vnpy-da>=1.18.0",
    "vnpy-xt>=1.4.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
